<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pustaka Ajaib AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Bubblegum+Sans&display=swap');
        :root { --paper: #fdfbf7; }
        body {
            font-family: 'Quicksand', sans-serif;
            background: #cbd5e1;
            background-image: radial-gradient(#94a3b8 1px, transparent 1px);
            background-size: 25px 25px;
        }
        .font-magic { font-family: 'Bubblegum+Sans', cursive; }
        .book-wrapper {
            background: var(--paper);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        @media (min-width: 1024px) {
            .book-container { perspective: 2000px; height: 600px; }
            .book-wrapper {
                display: grid;
                grid-template-columns: 1fr 1fr;
                background: linear-gradient(to right, var(--paper) 48%, #e2e2e2 50%, var(--paper) 52%);
            }
        }
        .img-frame {
            aspect-ratio: 1/1;
            background: #fff;
            padding: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border-radius: 8px;
            max-width: 80%;
            margin: auto;
        }
        .img-frame img { width: 100%; height: 100%; object-fit: cover; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex flex-col p-4 md:p-8">

    <div id="app" class="flex-1 flex flex-col max-w-6xl mx-auto w-full">
        <header class="text-center mb-6">
            <h1 class="text-3xl md:text-5xl font-magic text-orange-600">📖 Pustaka Ajaib</h1>
        </header>

        <main id="input-section" class="flex-1 flex flex-col justify-center items-center">
            <div class="bg-white w-full max-w-md rounded-3xl p-8 shadow-2xl border-t-8 border-orange-500">
                <div class="space-y-4">
                    <input type="text" id="character-name" placeholder="Siapa namamu?" class="w-full p-4 bg-slate-50 border-2 rounded-2xl outline-none">
                    <textarea id="story-theme" rows="3" placeholder="Tema petualanganmu..." class="w-full p-4 bg-slate-50 border-2 rounded-2xl outline-none resize-none"></textarea>
                    <button onclick="startMagic()" class="w-full bg-orange-500 text-white font-bold py-4 rounded-2xl text-lg font-magic shadow-lg active:scale-95 transition-all">Mulai ✨</button>
                </div>
            </div>
        </main>

        <main id="loading-section" class="hidden flex-1 flex flex-col justify-center items-center text-center">
            <div class="w-16 h-16 border-4 border-orange-500 border-t-transparent rounded-full animate-spin mb-4"></div>
            <h2 class="text-2xl font-magic text-slate-700">Menyusun sihir...</h2>
        </main>

        <main id="reader-section" class="hidden flex-1 flex flex-col">
            <div class="flex justify-between items-center mb-4 bg-white/50 p-2 rounded-2xl shadow-sm">
                <button onclick="location.reload()" class="px-4 py-2 bg-white rounded-xl text-slate-400"><i class="fas fa-home"></i></button>
                <span id="page-indicator" class="font-bold text-orange-600">Hal 1</span>
                <div class="w-10"></div>
            </div>

            <div class="book-container flex-1">
                <div class="book-wrapper">
                    <div class="flex flex-col justify-center p-4">
                        <div class="img-frame">
                            <img id="page-img" src="" alt="Gambar Cerita">
                        </div>
                    </div>
                    <div class="flex flex-col p-6 lg:p-12 justify-between">
                        <div class="flex-1 flex flex-col justify-center">
                            <h2 id="story-title" class="text-xl md:text-3xl font-magic text-orange-600 mb-4 text-center"></h2>
                            <p id="story-text" class="text-lg md:text-2xl text-slate-700 leading-relaxed text-center lg:text-left"></p>
                        </div>
                        <div class="mt-6 space-y-3">
                            <button onclick="toggleSpeech()" class="w-full py-4 bg-orange-100 text-orange-600 rounded-2xl font-bold flex items-center justify-center gap-3">
                                <i id="play-icon" class="fas fa-play"></i> Dengarkan
                            </button>
                            <div class="flex gap-2">
                                <button onclick="prevPage()" class="w-1/4 py-4 bg-white rounded-2xl text-slate-400 border"><i class="fas fa-chevron-left"></i></button>
                                <button onclick="nextPage()" class="flex-1 py-4 bg-slate-800 text-white rounded-2xl font-bold">Lanjut</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // --- GANTI DENGAN API KEY ANDA ---
        const apiKey = "AIzaSyC99T7-VPWH9lB-vfZE37_6D_Pa3PMZtY8"; 

        let story = { pages: [] };
        let currentIndex = 0;
        let isSpeaking = false;
        const synth = window.speechSynthesis;

        async function startMagic() {
            const name = document.getElementById('character-name').value;
            const theme = document.getElementById('story-theme').value;
            if(!name || !theme) return alert("Isi dulu ya!");

            document.getElementById('input-section').classList.add('hidden');
            document.getElementById('loading-section').classList.remove('hidden');

            const prompt = `Buat cerita anak 5 halaman. Jagoan: ${name}. Tema: ${theme}. Berikan dalam format JSON murni: {"title": "Judul", "pages": [{"text": "isi cerita"}]}`;

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { responseMimeType: "application/json" } })
                });

                const data = await res.json();
                story = JSON.parse(data.candidates[0].content.parts[0].text);

                document.getElementById('loading-section').classList.add('hidden');
                document.getElementById('reader-section').classList.remove('hidden');
                render();
            } catch (e) {
                alert("Waduh, koneksi gagal. Cek API Key!");
                location.reload();
            }
        }

        function render() {
            const p = story.pages[currentIndex];
            document.getElementById('story-title').innerText = story.title;
            document.getElementById('story-text').innerText = p.text;
            document.getElementById('page-indicator').innerText = `Hal ${currentIndex + 1} / ${story.pages.length}`;
            
            // Gambar otomatis dari internet agar Vercel tidak Error CORS
            document.getElementById('page-img').src = `https://loremflickr.com/500/500/cartoon,${encodeURIComponent(document.getElementById('story-theme').value)}?lock=${currentIndex}`;
            
            stopSpeech();
        }

        function toggleSpeech() {
            if(isSpeaking) { stopSpeech(); } 
            else {
                const utter = new SpeechSynthesisUtterance(story.pages[currentIndex].text);
                utter.lang = 'id-ID';
                utter.onend = () => { isSpeaking = false; document.getElementById('play-icon').className = "fas fa-play"; };
                synth.speak(utter);
                isSpeaking = true;
                document.getElementById('play-icon').className = "fas fa-stop";
            }
        }

        function stopSpeech() {
            synth.cancel();
            isSpeaking = false;
            document.getElementById('play-icon').className = "fas fa-play";
        }

        function nextPage() {
            if(currentIndex < story.pages.length - 1) { currentIndex++; render(); } 
            else { location.reload(); }
        }

        function prevPage() {
            if(currentIndex > 0) { currentIndex--; render(); }
        }
    </script>
</body>
</html>
