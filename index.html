<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pustaka Ajaib AI - Buku Cerita Seru!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Bubblegum+Sans&display=swap');
        
        :root {
            --primary: #f97316;
            --paper: #fdfbf7;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: #cbd5e1;
            color: #1e293b;
            background-image: radial-gradient(#94a3b8 1px, transparent 1px);
            background-size: 25px 25px;
            overflow-x: hidden;
            margin: 0;
            /* TAMBAHAN: Jarak aman agar tidak tertutup inisial H */
            padding-top: 80px; 
            padding-bottom: 40px;
        }

        .font-magic { font-family: 'Bubblegum+Sans', cursive; }

        /* Fullscreen adjustment */
        #app {
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        /* Real Book Effect */
        .book-wrapper {
            background: var(--paper);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100%;
            transition: all 0.3s ease;
        }

        @media (min-width: 1024px) {
            .book-container { perspective: 2000px; height: 650px; }
            .book-wrapper {
                display: grid;
                grid-template-columns: 1fr 1fr;
                background: linear-gradient(to right, var(--paper) 0%, var(--paper) 48%, #e2e2e2 50%, var(--paper) 52%, var(--paper) 100%);
            }
        }

        @media (max-width: 1023px) {
            .book-container { height: auto; min-height: 500px; }
        }

        .page-content-animate {
            animation: pageFadeIn 0.5s ease-out forwards;
        }

        @keyframes pageFadeIn {
            0% { opacity: 0; filter: blur(5px); }
            100% { opacity: 1; filter: blur(0); }
        }

        .img-frame {
            aspect-ratio: 1/1;
            background: #fff;
            padding: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border-radius: 4px;
            position: relative;
            max-width: 85%;
            margin: auto;
        }

        .img-frame img {
            width: 100%; height: 100%;
            object-fit: cover;
            border-radius: 2px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col px-4">

    <div id="message-box" class="fixed top-5 right-5 z-[3000] translate-x-[150%] opacity-0 transition-all duration-300">
        <div class="bg-white border-l-4 border-orange-500 shadow-2xl p-4 rounded-xl flex items-center gap-3">
            <i id="message-icon" class="text-orange-500 text-xl"></i>
            <p id="message-text" class="font-bold text-slate-800 text-sm"></p>
        </div>
    </div>

    <div id="app" class="flex-1 flex flex-col max-w-6xl mx-auto w-full">
        
        <header id="main-header" class="flex justify-between items-center mb-6">
            <div class="w-10"></div>
            <h1 class="text-3xl md:text-5xl font-magic text-orange-600 drop-shadow-md">📖 Pustaka Ajaib</h1>
            <button onclick="toggleFullScreen()" class="w-10 h-10 md:w-12 md:h-12 bg-white rounded-full shadow-lg flex items-center justify-center text-slate-400 hover:text-orange-500 transition-all active:scale-90">
                <i id="fs-icon" class="fas fa-expand"></i>
            </button>
        </header>

        <main id="input-section" class="flex-1 flex flex-col justify-center items-center">
            <div class="bg-white w-full max-w-lg rounded-3xl p-6 md:p-10 shadow-2xl border-t-8 border-orange-500">
                <div class="space-y-6">
                    <div class="text-center">
                        <h2 class="text-2xl font-bold text-slate-800">Hai, Teman Kecil! 👋</h2>
                        <p class="text-slate-500 font-medium">Bikin cerita seru pakai namamu, yuk!</p>
                    </div>

                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-bold text-slate-600 mb-1 ml-2">Siapa nama jagoannya?</label>
                            <input type="text" id="character-name" 
                                class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl focus:border-orange-400 outline-none transition"
                                placeholder="Namamu atau nama favoritmu">
                        </div>

                        <div>
                            <label class="block text-sm font-bold text-slate-600 mb-1 ml-2">Mau petualangan apa?</label>
                            <textarea id="story-theme" rows="3" 
                                class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl focus:border-orange-400 outline-none transition resize-none"
                                placeholder="Misal: Pergi ke pulau donat atau main sama naga..."></textarea>
                        </div>
                    </div>

                    <button onclick="startMagic()" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-5 rounded-2xl text-xl font-magic shadow-xl transition-all active:scale-95 flex items-center justify-center gap-3">
                        Mulai Petualangan! ✨
                    </button>
                </div>
            </div>
        </main>

        <main id="loading-section" class="hidden flex-1 flex flex-col justify-center items-center text-center">
            <div class="relative mb-8">
                <div class="w-24 h-24 border-8 border-orange-100 border-t-orange-500 rounded-full animate-spin"></div>
                <i class="fas fa-magic-wand-sparkles absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-orange-500 text-2xl"></i>
            </div>
            <h2 class="text-2xl font-magic text-slate-700">Sihir Sedang Bekerja...</h2>
            <p id="loading-status" class="text-orange-600 font-bold mt-2">Lagi bikin cerita ajaib buat kamu...</p>
        </main>

        <main id="reader-section" class="hidden flex-1 flex flex-col">
            <div class="book-container flex-1">
                <div class="book-wrapper page-content-animate" id="page-anim-container">
                    <div class="flex flex-col justify-center p-6">
                        <div class="img-frame">
                            <img id="page-img" src="" alt="Ilustrasi">
                        </div>
                    </div>
                    <div class="flex flex-col p-8 justify-between">
                        <div>
                            <h2 id="story-title" class="text-2xl font-magic text-orange-600 mb-4"></h2>
                            <p id="story-text" class="text-lg text-slate-700 leading-relaxed font-medium"></p>
                        </div>
                        
                        <div class="flex gap-4 mt-6">
                            <button onclick="prevPage()" class="px-6 py-3 bg-slate-200 rounded-xl font-bold">Kembali</button>
                            <button id="next-btn" onclick="nextPageManual()" class="flex-1 bg-orange-500 text-white font-bold rounded-xl py-3 shadow-lg">Lanjut</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // MASALAH 2 FIX: API Key sudah dimasukkan
        const apiKey = "AIzaSyBthSuIC7Xk2deHfW3OTi-h0S8ZnfGBy64"; 
        let story = { title: "", pages: [] };
        let currentIndex = 0;

        function showMsg(txt, isErr = false) {
            const box = document.getElementById('message-box');
            document.getElementById('message-text').innerText = txt;
            document.getElementById('message-icon').className = isErr ? "fas fa-times-circle text-red-500" : "fas fa-star text-orange-500";
            box.classList.remove('translate-x-[150%]', 'opacity-0');
            setTimeout(() => box.classList.add('translate-x-[150%]', 'opacity-0'), 3000);
        }

        async function fetchAI(prompt) {
            // MASALAH 1 FIX: Menggunakan model gemini-1.5-flash yang stabil
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: { responseMimeType: "application/json" }
                })
            });
            
            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error.message || "Gagal menghubungi AI");
            }
            return await response.json();
        }

        async function startMagic() {
            const charName = document.getElementById('character-name').value.trim();
            const theme = document.getElementById('story-theme').value.trim();
            if (!charName || !theme) return showMsg("Isi nama dan temanya dulu ya!", true);

            document.getElementById('input-section').classList.add('hidden');
            document.getElementById('loading-section').classList.remove('hidden');

            try {
                // Prompt diperjelas agar AI memberikan hasil yang konsisten
                const prompt = `Buat cerita anak pendek 5 halaman. Tokoh utama: ${charName}. Tema: ${theme}. Bahasa Indonesia santai dan ceria. Format JSON harus: {"title": "Judul", "pages": [{"text": "isi cerita", "img_prompt": "deskripsi gambar 3d gaya kartun"}]}`;
                
                const res = await fetchAI(prompt);
                const rawText = res.candidates[0].content.parts[0].text;
                story = JSON.parse(rawText);

                // Untuk keperluan demo cepat, kita gunakan placeholder gambar jika Imagen belum aktif di key ini
                story.pages.forEach((p, i) => {
                    p.img = `https://picsum.photos/seed/${charName}${i}/600/600`;
                });

                document.getElementById('loading-section').classList.add('hidden');
                document.getElementById('reader-section').classList.remove('hidden');
                render();
            } catch (e) {
                console.error(e);
                showMsg("Error: " + e.message, true);
                setTimeout(() => location.reload(), 4000);
            }
        }

        function render() {
            const p = story.pages[currentIndex];
            document.getElementById('story-title').innerText = story.title;
            document.getElementById('story-text').innerText = p.text;
            document.getElementById('page-img').src = p.img;
            document.getElementById('next-btn').innerText = currentIndex === story.pages.length - 1 ? "Tamat (Bikin Lagi)" : "Halaman Selanjutnya";
        }

        function nextPageManual() {
            if (currentIndex < story.pages.length - 1) {
                currentIndex++;
                render();
            } else {
                location.reload();
            }
        }

        function prevPage() {
            if (currentIndex > 0) {
                currentIndex--;
                render();
            }
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }
    </script>
</body>
</html>
