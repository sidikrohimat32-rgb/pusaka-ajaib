<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pustaka Ajaib - Dongeng Anak AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Bubblegum+Sans&display=swap');
        
        :root { --primary: #f97316; --paper: #fdfbf7; }

        body {
            font-family: 'Quicksand', sans-serif;
            background: #cbd5e1;
            background-image: radial-gradient(#94a3b8 1px, transparent 1px);
            background-size: 25px 25px;
            margin: 0; padding: 0;
        }

        .font-magic { font-family: 'Bubblegum+Sans', cursive; }

        .book-wrapper {
            background: var(--paper);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }

        @media (min-width: 1024px) {
            .book-container { perspective: 2000px; height: 600px; }
            .book-wrapper {
                display: grid;
                grid-template-columns: 1fr 1fr;
                background: linear-gradient(to right, var(--paper) 48%, #e2e2e2 50%, var(--paper) 52%);
            }
        }

        .img-frame {
            aspect-ratio: 1/1;
            background: #fff;
            padding: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border-radius: 8px;
            max-width: 85%;
            margin: auto;
        }

        .img-frame img { width: 100%; height: 100%; object-fit: cover; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex flex-col p-4 md:p-8">

    <div id="app" class="flex-1 flex flex-col max-w-6xl mx-auto w-full">
        
        <header class="text-center mb-6">
            <h1 class="text-3xl md:text-5xl font-magic text-orange-600 drop-shadow-md">📖 Pustaka Ajaib</h1>
        </header>

        <main id="input-section" class="flex-1 flex flex-col justify-center items-center">
            <div class="bg-white w-full max-w-md rounded-3xl p-8 shadow-2xl border-t-8 border-orange-500">
                <div class="space-y-5">
                    <div class="text-center">
                        <h2 class="text-xl font-bold text-slate-800">Halo, Ayah & Bunda!</h2>
                        <p class="text-slate-500 text-sm">Buat dongeng kustom untuk si kecil sekarang.</p>
                    </div>

                    <div class="space-y-3">
                        <input type="text" id="character-name" placeholder="Nama si kecil (Jagoan)" 
                            class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl focus:border-orange-400 outline-none">
                        
                        <textarea id="story-theme" rows="3" placeholder="Tema (Contoh: Berpetualang ke bulan)" 
                            class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl focus:border-orange-400 outline-none resize-none"></textarea>
